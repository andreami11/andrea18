<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Sei invitato alla mia festa!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0a1a3d; --blue:#2f6bff; --accent:#6cb4ff; --text:#f4f4fa; --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.16); --fire:#ffb703; --violet:#7c5cff; --lilac:#b9a6ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 50% -8%,rgba(47,107,255,.5),transparent 65%),radial-gradient(600px 400px at 100% 100%,rgba(124,92,255,.25),transparent 60%),var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px}
h1{font-weight:800;font-size:clamp(2.2rem,9vw,4.6rem);line-height:1;margin:0;letter-spacing:-.025em;max-width:12ch}
.sub{font-size:1.1rem;opacity:.7;margin:0 0 12px;max-width:30ch}
.cake{width:min(260px,70vw);height:auto;overflow:visible}
.flame{transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.glow{animation:pulse 1.2s ease-in-out infinite alternate;transition:opacity .35s}
.out .flame,.out .glow{opacity:0;animation:none}
.out .flame{transform:scaleY(.2)}
.smoke{opacity:0}
.out .smoke{animation:smoke 2s ease-out forwards}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
@keyframes pulse{from{opacity:.3}to{opacity:.6}}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
button{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:999px;padding:16px 30px;background:var(--violet);color:#fff;cursor:pointer;transition:transform .15s}
button:hover{transform:scale(1.05)}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hint{font-size:.95rem;opacity:.6;margin-top:6px}
.card{max-width:480px;margin:0 auto;padding:0 20px 90px;display:none}
.card.show{display:block}
.deck{display:flex;flex-direction:column;gap:16px}
.age{display:flex;align-items:flex-end;gap:12px;line-height:.85}
.age span{font-size:clamp(7rem,38vw,11rem);font-weight:800;letter-spacing:-.06em;background:linear-gradient(135deg,var(--accent) 0%,var(--lilac) 55%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.05em}
.age small{font-size:1.5rem;font-weight:800;opacity:.85;padding-bottom:.9rem}
.msg{font-size:1.2rem;line-height:1.45;margin:0;opacity:.92}
.info{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px 22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:4px}
.k{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
.v{font-weight:800;font-size:1.5rem;line-height:1.15}
.s{font-size:1rem;opacity:.7}
.note{margin:0;font-size:1rem;opacity:.7}
.line{opacity:0;transform:translateY(18px)}
.show .line{animation:in .6s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i)*.14s)}
@keyframes in{to{opacity:1;transform:none}}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.cta{text-align:center;text-decoration:none;font-weight:800;font-size:1.15rem;border-radius:999px;padding:17px 26px;transition:transform .15s}
.cta:hover{transform:scale(1.03)}
.cta.yes{background:var(--violet);color:#fff}
.cta.no{border:1px solid var(--line);color:var(--text);background:var(--glass)}
@media (prefers-reduced-motion:reduce){.flame,.glow{animation:none}.show .line{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<main>
  <section class="stage" id="stage">
    <h1 id="t1">Ho una cosa da dirti…</h1>
    <p class="sub" id="t2">Prima però devi spegnere la candela.</p>
    <svg class="cake" id="cake" viewBox="0 0 260 230" role="img" aria-label="Torta con una candela accesa">
      <ellipse class="glow" cx="130" cy="42" rx="52" ry="52" fill="#ffb703" opacity=".5"/>
      <g class="smoke"><circle cx="130" cy="40" r="6" fill="#f4f4fa"/><circle cx="136" cy="28" r="4" fill="#f4f4fa"/></g>
      <path class="flame" d="M130 18c14 16 16 28 0 40-16-12-14-24 0-40z" fill="#ffb703"/>
      <path class="flame" d="M130 36c6 7 7 12 0 18-7-6-6-11 0-18z" fill="#ff5a3c"/>
      <rect x="125" y="56" width="10" height="46" rx="3" fill="#6cb4ff"/>
      <rect x="30" y="100" width="200" height="50" rx="12" fill="#7c5cff"/>
      <path d="M30 118c20 14 30-6 50 8s30-6 50 8 30-6 50 8 20 2 50-6v14H30z" fill="#f4f4fa"/>
      <rect x="10" y="150" width="240" height="64" rx="14" fill="#f4f4fa"/>
      <rect x="10" y="190" width="240" height="24" rx="12" fill="#6cb4ff"/>
    </svg>
    <button id="blow" type="button">Soffia sulla candela</button>
    <span class="hint" id="hint">oppure tocca la fiamma</span>
  </section>

  <section class="card" id="card" aria-live="polite">
    <div class="deck">
      <div class="age line" style="--i:0"><span id="age"></span><small>anni</small></div>
      <p class="msg line" style="--i:1" id="msg"></p>
      <div class="info line" style="--i:2"><span class="k">Quando</span><span class="v" id="when"></span></div>
      <div class="info line" style="--i:3"><span class="k">Dove</span><span class="v" id="where"></span><span class="s" id="where2"></span></div>
      <p class="note line" style="--i:4" id="note"></p>
      <div class="btns line" style="--i:5">
        <a class="cta yes" id="yes" href="#">Ci sono! 🎉</a>
        <a class="cta no" id="no" href="#">Purtroppo non riesco</a>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== MODIFICA QUI I TUOI DATI ===== */
var INVITO = {
  eta: "18",
  messaggio: "Mi farebbe piacere festeggiare questo traguardo con te! Ci aspettano buon cibo e tanta voglia di stare insieme.",
  quando: "Sabato 12 dicembre, ore 20:00",
  dove: "Buono Come il Pane",
  dove2: "Via Roma, 14, 45030 Villamarzana (RO)",
  nota: "Porta soprattutto la voglia di stare in compagnia!",
  gruppo: "https://chat.whatsapp.com/Jd45hGTBTBmCaFe9PlNkeP?s=cl&p=i&iam=2",
  whatsapp: "393805895797",
  rispostaNo: "Ciao Andrea! Mi dispiace tanto, ma al tuo 18° non riesco ad esserci. Buona serata 🙂"
};
/* ==================================== */

var $ = function(id){ return document.getElementById(id); };
$("t1").textContent = "Ciao, c’è una novità per te…";
$("age").textContent = INVITO.eta;
$("msg").textContent = INVITO.messaggio;
$("when").textContent = INVITO.quando;
$("where").textContent = INVITO.dove;
$("where2").textContent = INVITO.dove2;
$("note").textContent = INVITO.nota;
$("yes").href = INVITO.gruppo;
$("no").href = "https://wa.me/" + INVITO.whatsapp + "?text=" + encodeURIComponent(INVITO.rispostaNo);

var cv = $("c"), cx = cv.getContext("2d"), parts = [], running = false;
var colors = ["#6cb4ff","#7c5cff","#b9a6ff","#f4f4fa"];
function size(){ cv.width = innerWidth; cv.height = innerHeight; }
size(); addEventListener("resize", size);

function burst(){
  for (var i = 0; i < 160; i++) {
    var a = Math.random() * Math.PI * 2, s = 6 + Math.random() * 10;
    parts.push({ x: cv.width / 2, y: cv.height * 0.4, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6,
      w: 6 + Math.random() * 6, h: 10 + Math.random() * 6, r: Math.random() * 6, vr: Math.random() * .4 - .2,
      c: colors[i % colors.length], life: 160 + Math.random() * 60 });
  }
  if (!running) { running = true; tick(); }
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(function(p){ return p.life > 0 && p.y < cv.height + 20; });
  parts.forEach(function(p){
    p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.globalAlpha = Math.min(1, p.life / 40); cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore();
  });
  if (parts.length) requestAnimationFrame(tick); else running = false;
}

var done = false;
function blow(){
  if (done) return; done = true;
  $("cake").classList.add("out");
  $("cake").setAttribute("aria-label", "Candela spenta");
  $("t1").textContent = "Missione compiuta 🎉";
  $("t2").textContent = "Ecco il tuo invito:";
  $("blow").style.display = "none"; $("hint").style.display = "none";
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) burst();
  setTimeout(function(){
    $("card").classList.add("show");
    $("card").scrollIntoView({ behavior: "smooth", block: "start" });
  }, 900);
}
$("blow").addEventListener("click", blow);
$("cake").addEventListener("click", blow);
</script>
</body>
</html>
